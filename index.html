<!doctype html>
<html lang="ja">
<head>
<title>五十音スイーパー</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 黒板の一枚絵として、明暗どちらの画面でも同じ色で描く */
:root{
  --board:#22382e; --board2:#2a4437; --board3:#1b2d25; --frame:#7b5b3a; --frame2:#5e4329;
  --chalk:#eef1e7; --dim:#a9bcae; --faint:#6f8a7a; --line:#3d5a4b;
  --yellow:#f3d76e; --red:#f2897a; --blue:#8fc6ea; --green:#a8dc9a; --pink:#f0a8cf; --orange:#f5b26b;
  --font-k:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-b:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board3);color:var(--chalk);font-family:var(--font-b);font-size:15px;line-height:1.6}
body{background:radial-gradient(ellipse at 50% 0%,var(--board2),var(--board3) 70%) fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.num{font-variant-numeric:tabular-nums}
.btn{background:transparent;border:2px solid var(--dim);border-radius:10px;padding:7px 14px;min-height:40px;font-weight:700;color:var(--chalk)}
.btn:hover:not(:disabled){border-color:var(--chalk)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{background:var(--yellow);border-color:var(--yellow);color:var(--board3)}
.btn.small{min-height:32px;padding:3px 10px;font-size:13px;border-width:1.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--dim)}
.note{font-size:13px;color:var(--dim)}
.note a{color:var(--blue)}

/* 題 */
.hero{text-align:center;padding:22px 0 8px}
.hero h1{font-family:var(--font-k);font-weight:600;font-size:clamp(34px,9vw,54px);margin:0;letter-spacing:.06em;text-wrap:balance}
.hero h1 b{color:var(--yellow);font-weight:600}
.hero p{margin:6px auto 0;max-width:32em;color:var(--dim)}
.howto{margin:18px auto 0;max-width:34em;display:grid;gap:8px}
.howto div{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.howto i{font-style:normal;font-family:var(--font-k);font-size:20px;color:var(--yellow);text-align:center;line-height:1.3}
.starts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.starts .btn{min-width:150px;min-height:52px;font-size:17px}
.recs{margin-top:14px;text-align:center;font-size:13px;color:var(--dim)}
.credit{margin-top:26px;text-align:center;font-size:12px;color:var(--faint)}

/* 遊ぶ画面 */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qno{font-family:var(--font-k);font-size:18px;color:var(--yellow)}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--dim)}
.clue{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:4px 0 10px}
.clue .cat{font-family:var(--font-k);font-size:24px}
.clue .len{font-size:14px;color:var(--dim)}
.clue .len b{color:var(--red);font-size:18px}
.prefix{margin:-4px 0 10px;padding:6px 12px;border-left:3px solid var(--green);background:rgba(168,220,154,.08);font-size:14px;color:var(--dim)}
.prefix b{font-family:var(--font-k);font-size:24px;letter-spacing:.12em;color:var(--green);font-weight:600}
.prefix i{font-style:normal;font-family:var(--font-k);font-size:24px;letter-spacing:.12em;color:var(--faint)}
.hintq{margin:-4px 0 10px;padding:8px 12px;border-left:3px solid var(--yellow);background:rgba(243,215,110,.08);font-family:var(--font-k);font-size:16px}

.frame{background:var(--frame);border-radius:12px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px var(--frame2)}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;background:var(--board);border-radius:6px;padding:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cell{position:relative;aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:var(--board2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-k);font-size:clamp(15px,4.6vw,26px);font-weight:600;color:var(--chalk);padding:0;line-height:1}
.cell.gap{border:0;background:transparent;pointer-events:none}
.cell.closed:hover{border-color:var(--dim);background:#31503f}
.cell.open{background:var(--board3);border-color:var(--board3);cursor:default}
.cell.open .k{position:absolute;left:3px;top:2px;font-size:clamp(9px,2.4vw,12px);color:var(--faint);font-weight:400}
.cell.open .n{font-family:var(--font-b);font-weight:700;font-size:clamp(16px,5vw,26px)}
.cell.open.pop{animation:pop .25s ease-out backwards}
@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:none;opacity:1}}
.n0{color:var(--faint)}.n1{color:var(--blue)}.n2{color:var(--green)}.n3{color:var(--red)}.n4{color:var(--pink)}.n5{color:var(--orange)}.n6,.n7,.n8{color:var(--yellow)}
.cell.flag{border-color:var(--red)}
.cell .x{position:absolute;right:2px;bottom:1px;font-family:var(--font-b);font-size:clamp(9px,2.6vw,13px);font-weight:700;color:var(--red);line-height:1}
.cell.reveal .x{color:var(--yellow)}.cell.boom .x{color:var(--yellow)}
.cell.flag::before{content:"";position:absolute;inset:9%;border:2.5px solid var(--red);border-radius:50%;transform:rotate(-8deg)}
.cell.boom{background:#5a2a25;border-color:var(--red);color:var(--yellow)}
.cell.boom::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(242,137,122,.55),transparent 70%)}
.cell.boom.pop{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.cell.reveal{border-color:var(--yellow);color:var(--yellow)}
.cell.reveal::before{content:"";position:absolute;inset:9%;border:2.5px dashed var(--yellow);border-radius:50%}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 8px}
.sbp{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:10px;padding:4px 12px}
.sbp .nm{font-family:var(--font-k);font-size:17px}
.sbp b{font-size:26px;line-height:1.2}
.sbp.p0 .nm,.sbp.p0 b{color:var(--red)}.sbp.p1 .nm,.sbp.p1 b{color:var(--blue)}
.sbp.now.p0{border-color:var(--red);background:rgba(242,137,122,.1)}.sbp.now.p1{border-color:var(--blue);background:rgba(143,198,234,.1)}
.turnbar{margin:0 0 8px;padding:6px 12px;border-radius:10px;font-size:14px;color:var(--dim)}
.turnbar b{font-size:17px}
.turnbar.p0{border-left:4px solid var(--red)}.turnbar.p0 b{color:var(--red)}
.turnbar.p1{border-left:4px solid var(--blue)}.turnbar.p1 b{color:var(--blue)}
.frame.p0{box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px var(--frame2),0 0 0 3px var(--red)}
.frame.p1{box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px var(--frame2),0 0 0 3px var(--blue)}
.grid.wait{pointer-events:none;opacity:.85}
.result.p0{border-color:var(--red)}.result.p1{border-color:var(--blue)}.result.px{border-color:var(--dim)}
.vlog{margin:12px 0 0;padding-left:20px;font-size:13px;color:var(--dim);display:grid;gap:2px}
.vlog li:first-child{color:var(--chalk)}
.lenpick{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
.lenpick .mode button{font-size:14px}
.starts-group{margin-top:18px;display:grid;gap:8px}
.sg-h{text-align:center;font-family:var(--font-k);font-size:18px;color:var(--yellow)}
.starts-group .starts{margin-top:0}
.starts.cpu{align-items:center}
.starts.cpu .btn{min-width:84px;min-height:44px;font-size:15px}
.netbox{display:grid;gap:14px;max-width:560px;margin:8px auto 0}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.step>b{font-family:var(--font-k);font-size:24px;color:var(--yellow);text-align:center;line-height:1.2}
.step>div{display:grid;gap:6px}
.netbox textarea{width:100%;background:var(--board3);border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--chalk);font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical;word-break:break-all}
.netbox textarea:focus{border-color:var(--yellow);outline:none}
.netbox .ok{padding:10px 14px;border:2px solid var(--green);border-radius:12px;background:rgba(168,220,154,.08);display:grid;gap:8px}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.mode{display:inline-flex;border:2px solid var(--dim);border-radius:10px;overflow:hidden}
.mode button{border:0;background:transparent;padding:6px 12px;min-height:38px;font-weight:700;color:var(--dim)}
.mode button.on{background:var(--chalk);color:var(--board3)}
.score{font-size:13px;color:var(--dim)}
.score b{font-size:18px;color:var(--chalk)}
.lives{letter-spacing:.15em;color:var(--red)}
.lives s{text-decoration:none;color:var(--line)}

.answer{margin-top:10px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;align-items:center}
.chip{min-width:38px;min-height:38px;border-radius:50%;border:2px solid var(--red);background:transparent;font-family:var(--font-k);font-size:19px;font-weight:600;padding:0}
.chip:hover{background:rgba(242,137,122,.15)}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;background:var(--board3);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-family:var(--font-k);font-size:20px;color:var(--chalk)}
.ansrow input:focus{border-color:var(--yellow);outline:none}
.ansrow input.bad{animation:shake .35s;border-color:var(--red)}
.msg{min-height:22px;font-size:14px}
.msg.bad{color:var(--red)}.msg.good{color:var(--green)}

.result{margin-top:12px;padding:14px 16px;border-radius:12px;border:2px solid var(--yellow);background:rgba(243,215,110,.07);display:grid;gap:6px}
.result h2{margin:0;font-family:var(--font-k);font-weight:600;font-size:26px}
.result .word{font-family:var(--font-k);font-size:30px;color:var(--yellow);letter-spacing:.1em}
.result .break{font-size:13px;color:var(--dim)}
.final{margin-top:16px;text-align:center;display:grid;gap:10px;justify-items:center}
.final .big{font-family:var(--font-k);font-size:44px;color:var(--yellow);line-height:1.1}
.final .marks{font-size:28px;letter-spacing:.2em}
.final table{border-collapse:collapse;font-size:14px}
.final td{padding:3px 10px;border-bottom:1px solid var(--line);text-align:left}
.final td.r{text-align:right}
.share{white-space:pre;font-family:var(--font-b);font-size:13px;background:var(--board3);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left}
@media (max-width:480px){.frame{padding:4px;border-radius:9px}.grid{gap:2px;padding:3px}.cell{border-radius:4px}}
@media (prefers-reduced-motion:reduce){.cell.open.pop,.cell.boom.pop,.ansrow input.bad{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= 乱数・小物 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

/* ================= 五十音表 =================
   画面は昔ながらの縦書きの表: 右端が「あ」の列、その左に「わ・を・ん」の列、左下に「ー」。上から あ段・い段・う段・え段・お段 */
const COLS=["あいうえお","かきくけこ","さしすせそ","たちつてと","なにぬねの","はひふへほ","まみむめも","や・ゆ・よ","らりるれろ","わ・を・ん","・・・・ー"];
const NCOL=COLS.length,NROW=5;
const CELLS=[];          // {kana,x,y}  x=画面の列（左0）, y=段
const AT={};             // "x,y" -> cell index
const BYKANA={};         // kana -> cell index
COLS.forEach((col,c)=>{const x=NCOL-1-c;[...col].forEach((k,y)=>{if(k==="・")return;const i=CELLS.length;CELLS.push({kana:k,x,y});AT[x+","+y]=i;BYKANA[k]=i})});
const NB=CELLS.map(({x,y})=>{const r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const j=AT[(x+dx)+","+(y+dy)];if(j!==undefined)r.push(j)}return r});

/* 濁点・半濁点・小さい字・カタカナを、表の文字にそろえる */
const FOLD_FROM="がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽぁぃぅぇぉっゃゅょゎゔ";
const FOLD_TO  ="かきくけこさしすせそたちつてとはひふへほはひふへほあいうえおつやゆようう";
function fold(s){
  let out="";
  for(let ch of String(s).normalize("NFC")){
    const c=ch.charCodeAt(0);
    if(c>=0x30A1&&c<=0x30F6)ch=String.fromCharCode(c-0x60);   // カタカナ→ひらがな
    const p=FOLD_FROM.indexOf(ch);if(p>=0)ch=FOLD_TO[p];
    if(ch==="-"||ch==="－"||ch==="ｰ"||ch==="〜")ch="ー";   // のばす音は「ー」のマス（1文字に数える）
    if(/\s/.test(ch)||ch==="・")continue;
    out+=ch;
  }
  return out;
}

/* ================= 問題（答え・分類・問題文） =================
   答えの文字（濁点などをはずした形）は、5文字以上。同じ字は CAP 回まで（そのマスに爆弾が重なる）。DEV.audit() で確かめる */
const WORDS=[
 // たべもの
 ["とうもろこし","たべもの","ひげの数と粒の数が同じといわれる野菜"],
 ["オムライス","たべもの","ケチャップで味をつけたごはんを、卵で包んだ料理"],
 ["サンドイッチ","たべもの","イギリスの伯爵の名がついた、パンに具をはさんだもの"],
 ["まんじゅう","たべもの","あんこを皮で包んで蒸したお菓子"],
 ["おこのみやき","たべもの","キャベツなどを入れた生地を鉄板で焼く、大阪や広島の名物"],
 ["さつまいも","たべもの","焼きいもにすることが多い、赤紫の皮のいも"],
 ["じゃがいも","たべもの","フライドポテトやカレーに使う、丸いいも"],
 ["たまごやき","たべもの","卵を巻きながら焼いた、お弁当の定番"],
 ["めだまやき","たべもの","卵を割ってそのまま焼いた、黄身が目のような料理"],
 ["にくじゃが","たべもの","肉とじゃがいもを甘辛く煮た家庭料理"],
 ["かつおぶし","たべもの","魚を干して固め、削ってだしをとるもの"],
 ["かしわもち","たべもの","こどもの日に食べる、葉で包んだもち"],
 ["さくらもち","たべもの","ひな祭りのころに食べる、桜の葉で包んだもち"],
 ["ケチャップ","たべもの","トマトから作る赤い調味料"],
 ["からしめんたいこ","たべもの","福岡の名物。すけとうだらの卵を辛く漬けたもの"],
 ["てまきずし","たべもの","自分で海苔に酢飯と具をのせて巻くすし"],
 ["いなりずし","たべもの","甘く煮た油揚げに酢飯をつめたすし"],
 ["ちゃわんむし","たべもの","器に入れた卵の汁を蒸した、ぷるぷるの料理"],
 ["クロワッサン","たべもの","三日月の形をした、バターたっぷりのパン"],
 ["スパゲッティ","たべもの","イタリアの細長いめん"],
 ["パイナップル","たべもの","とげとげの皮の、南国の果物"],
 ["さくらんぼ","たべもの","赤い実が2つぶら下がる、初夏の果物"],

 ["ところてん","たべもの","海藻から作り、突き出して細長くして食べるもの"],
 ["わらびもち","たべもの","きなこをかけて食べる、ぷるぷるの和菓子"],
 // どうぶつ
 ["かぶとむし","どうぶつ","夏の虫の王様。おすには大きな角がある"],
 ["てんとうむし","どうぶつ","赤に黒い点のある、小さな丸い虫"],

 ["ほたるいか","どうぶつ","富山湾で青く光る小さないか"],

 // ちめい
 ["ほっかいどう","ちめい","日本の都道府県でいちばん広い"],

 ["あまのはしだて","ちめい","日本三景の一つ。京都府にある、海の上の松並木"],
 ["おがさわら","ちめい","東京から船で丸一日かかる、世界遺産の島々"],
 ["いりおもてじま","ちめい","やまねこで知られる沖縄の島"],
 ["インドネシア","ちめい","1万以上の島がある、首都ジャカルタの国"],
 ["カンボジア","ちめい","アンコール・ワットがある国"],
 ["コロンビア","ちめい","コーヒーで知られる、南アメリカの国"],
 ["ジャマイカ","ちめい","レゲエと陸上短距離で知られる、カリブ海の国"],
 ["ナイジェリア","ちめい","アフリカでいちばん人口が多い国"],
 ["アイスランド","ちめい","火山と氷河の島国。首都はレイキャビク"],
 ["エベレスト","ちめい","世界でいちばん高い山"],
 ["キリマンジャロ","ちめい","アフリカでいちばん高い山"],
 // もの
 ["えんぴつけずり","もの","えんぴつの先をとがらせる道具"],
 ["ホッチキス","もの","紙を針でとじる道具"],
 ["ランドセル","もの","小学生が背負う、かたいかばん"],
 ["せんぷうき","もの","羽根を回して風を送る家電"],
 ["れいぞうこ","もの","食べ物を冷やしておく家電"],
 ["すいはんき","もの","ごはんを炊く家電"],

const CFG={LIVES:3,BASE:100,OPEN:-8,BOOM:-20,WRONG:-10,HINT:-15,MIN:10,DAILY:5};

// 同じ文字が2回あれば、そのマスに爆弾が2個（mc＝マスごとの爆弾の数。数字も2つ分）
const CAP=3;   // 1マスに重なる爆弾の最大（DEV.audit で確かめる）
function newPuzzle(pz){
  const mc=new Int8Array(CELLS.length);for(const k of pz.f)mc[BYKANA[k]]++;
  const mines=new Set();mc.forEach((v,i)=>{if(v)mines.add(i)});
  const cnt=CELLS.map((_,i)=>NB[i].reduce((s,j)=>s+mc[j],0));
  // 最初は全部閉じている（ユーザーの指定）。印は マス→1か2（爆弾2個の印）
  const P={pz,mc,mines,cnt,open:new Set(),flag:new Map(),boom:new Set(),lives:CFG.LIVES,opens:0,wrong:0,hint:false,done:false,won:false,pts:0,last:-1};
  return P;
}
function openCell(P,i,flags=P.flag){
  if(P.done||P.open.has(i)||P.boom.has(i)||flags.has(i))return null;
  P.last=i;
  if(P.mines.has(i)){
    P.boom.add(i);P.lives--;
    if(P.lives<=0)finish(P,false);
    return "boom";
  }
  // 0なら、まわりも自動で開く（印のマスはそのまま）。点は1回分だけ
  P.opens++;P.wave=flood(P,i,flags);
  return "safe";
}
function flood(P,i,flags=P.flag){
  const wave=new Map([[i,0]]),q=[i];P.open.add(i);
  while(q.length){const c=q.shift();if(P.cnt[c]!==0)continue;
    for(const j of NB[c]){if(P.open.has(j)||flags.has(j)||P.boom.has(j)||P.mines.has(j))continue;P.open.add(j);wave.set(j,wave.get(c)+1);q.push(j)}}
  return wave;
}
// 印: なし → 1 → 2（爆弾2個）→ なし
function toggleFlag(P,i){if(P.done||P.open.has(i)||P.boom.has(i))return false;const v=P.flag.get(i)||0;if(v>=2)P.flag.delete(i);else P.flag.set(i,v+1);return true}
// 答えの札に並べる文字（印の数・爆発した爆弾の数だけ）
function foundKana(P){const out=[];CELLS.forEach((c,i)=>{const n=P.boom.has(i)?P.mc[i]:(P.flag.get(i)||0);for(let k=0;k<n;k++)out.push(c.kana)});return out}

  if(a===P.pz.f){finish(P,true);return "right"}
  P.wrong++;prefixHint(P);return "wrong";
}

const allMarked=(P,flags=P.flag)=>CELLS.every((_,i)=>P.open.has(i)||P.boom.has(i)||flags.has(i));
function prefixHint(P,flags=P.flag){
  P.prefixNew=false;
  if(!allMarked(P,flags)||(P.prefix||0)>=P.pz.f.length-1)return false;
  P.prefix=(P.prefix||0)+1;P.prefixNew=true;return true;
}
function prefixHTML(P){
  // 友だちの端末には答えを送らないので、見せてよい文字（prefixChars）だけで描く
  const ch=P.prefixChars?P.prefixChars.concat(Array(P.prefixTotal-P.prefix).fill("")):[...P.pz.w].filter(c=>!/\s|・/.test(c));
  return `<div class="prefix">答えの最初: <b>${esc(ch.slice(0,P.prefix).join(""))}</b><i>${"○".repeat(ch.length-P.prefix)}</i></div>`;
}
function giveUp(P){if(!P.done)finish(P,false)}
function scoreOf(P){
  const s=CFG.BASE+CFG.OPEN*P.opens+CFG.BOOM*P.boom.size+CFG.WRONG*P.wrong+(P.hint?CFG.HINT:0);
  return Math.max(CFG.MIN,s);
}
function finish(P,won){P.done=true;P.won=won;P.pts=won?scoreOf(P):0}

/* ================= ふたりで対戦 =================
   自分の番には「マスを開ける」「答える」「パス」のどれか1つ。印はいつでも（番は使わない）。
   正解 +1、ちがう答え −1、爆弾を開ける −1。二人続けてパスすると問題文が出て、さらに二人続けてパスすると流れる */
const VS={RIGHT:1,WRONG:-1,BOOM:-1,ROUNDS:5};
function vsNew(kind,lvl,seed,len="normal"){
  const V={kind,lvl,seed,len,names:kind==="cpu"?["あなた","コンピュータ"]:["あか","あお"],score:[0,0],round:0,rounds:VS.ROUNDS,
    list:shuffled(poolOf(len),mulberry32(seed>>>0)).slice(0,VS.ROUNDS),results:[],over:false,P:null};
  vsRound(V);return V;
}
function vsRound(V){
  const P=newPuzzle(V.list[V.round]);
  P.lives=Infinity;P.turn=V.round%2;P.passes=0;P.winner=-1;P.log=[];P.pl=[0,0];V.P=P;
}
function vsLog(V,t){V.P.log.unshift(t)}
function vsEndTurn(V){V.P.turn=1-V.P.turn}
function vsOpen(V,i,flags){
  const P=V.P,t=P.turn;if(P.done)return null;
  const r=openCell(P,i,flags||P.flag);if(!r)return null;
  P.passes=0;
  if(r==="boom"){V.score[t]+=VS.BOOM;P.pl[t]+=VS.BOOM;vsLog(V,`${V.names[t]}：「${CELLS[i].kana}」を開けて爆発${P.mc[i]>1?`（爆弾${P.mc[i]}個）`:""}（−1）`)}
  else vsLog(V,`${V.names[t]}：「${CELLS[i].kana}」を開けた`+(P.wave.size>1?`（0なので ${P.wave.size} マス開いた）`:""));
  vsEndTurn(V);return r;
}
function vsAnswer(V,text,flags){
  const P=V.P,t=P.turn;if(P.done)return null;const a=fold(text);if(!a)return null;
  P.passes=0;
  if(a===P.pz.f){V.score[t]+=VS.RIGHT;P.pl[t]+=VS.RIGHT;P.done=true;P.winner=t;vsLog(V,`${V.names[t]}：「${text}」で正解（+${VS.RIGHT}）`);return "right"}
  V.score[t]+=VS.WRONG;P.pl[t]+=VS.WRONG;vsLog(V,`${V.names[t]}：「${text}」はちがう（−1）`);if(prefixHint(P,flags||P.flag))vsLog(V,`答えの最初の${P.prefix}文字を出した`);vsEndTurn(V);return "wrong";
}
function vsPass(V){
  const P=V.P,t=P.turn;if(P.done)return null;
  P.passes++;vsLog(V,`${V.names[t]}：パス`);
  if(P.passes>=2&&!P.hint){P.hint=true;P.passes=0;vsLog(V,"二人ともパスしたので、問題文を出した");vsEndTurn(V);return "hint"}
  if(P.passes>=2&&P.hint){P.done=true;P.winner=-1;vsLog(V,"二人ともパス。この問題は流れた");return "draw"}
  vsEndTurn(V);return "pass";
}
function vsNext(V){
  const P=V.P;V.results.push({w:P.pz.w,winner:P.winner,pl:P.pl.slice()});
  V.round++;if(V.round>=V.rounds){V.over=true;return}
  vsRound(V);
}
// コンピュータ: lvl 0 よわい / 1 ふつう / 2 つよい
function cpuDecide(V,rnd){
  const P=V.P,lvl=V.lvl;const a=analyze(P);
  if(Math.round(a.configs)===1){
    // 爆弾の文字が決まった。よわいは、ときどき並べかえに手間どる
    if(lvl>0||rnd()<0.6)return {type:"answer",text:P.pz.w};
  }
  // 言葉の知識: 分類と文字数が同じ言葉のうち、いまの数字と合うもの
  const head=P.pz.f.slice(0,P.prefix||0);
  const cands=PUZ.filter(q=>q.cat===P.pz.cat&&q.f.length===P.pz.f.length&&q.f.startsWith(head)&&consistentWith(P,q));
  if(P.prefix&&cands.length===1)return {type:"answer",text:cands[0].w};
  let sure=P.boom.size;for(const i of a.unknown)if(a.prob.get(i)>1-1e-9)sure++;
  // つよい: 爆弾の文字が半分以上はっきりして、合う言葉が1つなら答える
  if(lvl===2&&cands.length===1&&sure>=Math.ceil(P.pz.f.length/2))return {type:"answer",text:cands[0].w};
  // 問題文が出たあとは、思いあたる言葉で勝負する（はずれることもある）
  if(P.hint&&cands.length&&cands.length<=[2,3,3][lvl])return {type:"answer",text:cands[Math.floor(rnd()*cands.length)].w};
  let minp=Infinity;for(const i of a.unknown)if(!P.flag.has(i))minp=Math.min(minp,a.prob.get(i));
  const limit=[0.3,0.2,0.2][lvl];
  if(minp>limit)return {type:"pass"};
  let best=null,bs=-Infinity;
  for(const i of a.unknown){if(P.flag.has(i))continue;const p=a.prob.get(i);if(p>minp+1e-9+(lvl===0?0.15:0))continue;
    let u=0;if(lvl>0)for(const j of NB[i])if(!P.open.has(j)&&!P.boom.has(j)){const q=a.prob.get(j)||0;u+=q*(1-q)}
    u+=rnd()*(lvl===0?1:1e-6);if(u>bs){bs=u;best=i}}
  return best===null?{type:"pass"}:{type:"open",i:best};
}
function consistentWith(P,q){const mc=new Int8Array(CELLS.length);for(const k of q.f)mc[BYKANA[k]]++;
  for(const b of P.boom)if(mc[b]!==P.mc[b])return false;
  for(const i of P.open){if(mc[i])return false;let c=0;for(const j of NB[i])c+=mc[j];if(c!==P.cnt[i])return false}
  return true}
function cpuAct(V,rnd){const d=cpuDecide(V,rnd);if(d.type==="answer")return vsAnswer(V,d.text);if(d.type==="open")return vsOpen(V,d.i);return vsPass(V)}

/* ================= 読み（bot と確かめ用） =================
   開いた数字・爆発したマス（爆弾の個数も見える）・爆弾の総数だけから、各マスに爆弾がある確からしさを出す。
   1マスに 0〜CAP 個。置き方はどれも同じ重みとして数える */
const ways=(()=>{const m=new Map();const f=(n,r)=>{if(r<0||n<0)return 0;if(n===0)return r===0?1:0;const key=n*100+r;if(m.has(key))return m.get(key);let s=0;for(let v=0;v<=Math.min(CAP,r);v++)s+=f(n-1,r-v);m.set(key,s);return s};return f})();
function analyze(P){
  const K=P.pz.f.length,known=P.boom;let knownM=0;for(const b of known)knownM+=P.mc[b];
  const unknown=CELLS.map((_,i)=>i).filter(i=>!P.open.has(i)&&!known.has(i));
  const cons=[];
  for(const i of P.open){let need=P.cnt[i];const cells=[];for(const j of NB[i]){if(P.open.has(j))continue;if(known.has(j)){need-=P.mc[j];continue}cells.push(j)}if(cells.length)cons.push({cells,need})}
  const frontSet=new Set(cons.flatMap(c=>c.cells)),front=[...frontSet];
  const interior=unknown.filter(i=>!frontSet.has(i)),I=interior.length;
  const remain=K-knownM;
  const fi=new Map(front.map((c,k)=>[c,k])),cc=front.map(()=>[]);
  const C2=cons.map(c=>({cells:c.cells.map(x=>fi.get(x)),need:c.need}));C2.forEach((c,k)=>c.cells.forEach(x=>cc[x].push(k)));
  const L=front.length,val=new Int8Array(L),sum=new Int32Array(C2.length),left=C2.map(c=>c.cells.length);
  const perF=new Float64Array(L);let total=0,intMineW=0;
  const rec=(p,m)=>{
    if(m>remain)return;
    if(p===L){const r=remain-m;const w=ways(I,r);if(!w)return;
      total+=w;for(let t=0;t<L;t++)if(val[t])perF[t]+=w;intMineW+=w-ways(I-1,r);return}
    for(let v=0;v<=CAP;v++){let ok=true,over=false;for(const ci of cc[p]){const s=sum[ci]+v,l=left[ci]-1;if(s>C2[ci].need){ok=false;over=true;break}if(s+l*CAP<C2[ci].need){ok=false}}
      if(over)break;if(!ok)continue;
      val[p]=v;for(const ci of cc[p]){sum[ci]+=v;left[ci]--}rec(p+1,m+v);for(const ci of cc[p]){sum[ci]-=v;left[ci]++}val[p]=0}
  };
  rec(0,0);
  const prob=new Map();
  front.forEach((c,t)=>prob.set(c,perF[t]/total));
  const ip=I?intMineW/total:0;interior.forEach(c=>prob.set(c,ip));
  return {prob,configs:total,unknown};
}
// 爆弾の文字がすべて決まったか
function determined(P){const a=analyze(P);return Math.round(a.configs)===1}

// bot: いちばん安全なマスを開け、爆弾が決まったら答える。
//  how="smart": 確率が最も低く、まわりに未知が多いマス / "careless": 0の印以外ならどこでも
function botPlay(pz,seed,how){
  const P=newPuzzle(pz);let guard=0;
  while(!P.done&&guard++<60){
    if(determined(P)){answer(P,pz.w);break}
    const a=analyze(P);let best=null,bs=Infinity;
    const r=mulberry32(seed+guard*101);
    for(const i of a.unknown){if(P.flag.has(i))continue;const p=a.prob.get(i);
      let s;if(how==="careless")s=r();
      else{const unk=NB[i].filter(j=>!P.open.has(j)).length;s=p*100-unk*0.01+r()*1e-4}
      if(s<bs){bs=s;best=i}}
    if(best===null)break;
    openCell(P,best);
  }
  return {pts:P.pts,opens:P.opens,booms:P.boom.size,won:P.won};
}

/* ================= 効果音（確認用の強制無音つき） ================= */
const SND={on:(()=>{try{return localStorage.getItem("gojuon-sound")!=="off"}catch(e){return true}})(),ctx:null,hardMute:/[?&]mute\b/.test(location.search)};
function sfx(kind){
  if(!SND.on||SND.hardMute)return;
  try{
    const ctx=SND.ctx||(SND.ctx=new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==="suspended")ctx.resume();
    const now=ctx.currentTime,out=ctx.createGain();out.gain.value=.4;out.connect(ctx.destination);
    const tone=(type,f0,f1,t0,dur,vol)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,now+t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,now+t0+dur);g.gain.setValueAtTime(0.0001,now+t0);g.gain.exponentialRampToValueAtTime(vol,now+t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,now+t0+dur);o.connect(g);g.connect(out);o.start(now+t0);o.stop(now+t0+dur+.02)};
    const noise=(type,freq,t0,dur,vol)=>{const len=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,len,ctx.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;f.type=type;f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(out);s.start(now+t0)};
    if(kind==="open"){noise("highpass",2500,0,.05,.35);tone("triangle",720,0,0,.07,.08)}     // チョークでこつん
    else if(kind==="flag"){tone("sine",520,780,0,.1,.12)}
    else if(kind==="unflag"){tone("sine",600,420,0,.08,.08)}
    else if(kind==="boom"){noise("lowpass",500,0,.7,.9);tone("sine",120,50,0,.5,.3)}
    else if(kind==="right"){[523,659,784,1047].forEach((f,i)=>tone("triangle",f,0,i*.09,.35,.13))}
    else if(kind==="wrong"){tone("square",180,150,0,.22,.06)}
    else if(kind==="wave"){noise("highpass",2200,0,.05,.3);[660,880,1100].forEach((f,i)=>tone("triangle",f,0,.04+i*.05,.09,.06))}
    else if(kind==="pick"){tone("triangle",880,0,0,.05,.09)}
    else if(kind==="hint"){tone("sine",660,990,0,.18,.1)}
  }catch(e){}
}
function toggleSound(){SND.on=!SND.on;try{localStorage.setItem("gojuon-sound",SND.on?"on":"off")}catch(e){}if(SND.on)sfx("pick");render()}

/* ================= 記録 ================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= 進行 ================= */
let G=null;     // {mode:"daily"|"free", list:[pz..], idx, P, results:[]}（対戦は {mode:"vs", V}）
const UI={screen:"title",tool:"open",msg:"",msgKind:"",ans:"",pop:-1,bad:false,len:store.get("gojuon-len","normal")};
// 問題の長さ: ふつう＝5〜7文字、ながい＝8文字以上
const poolOf=len=>PUZ.filter(p=>len==="long"?p.f.length>=8:p.f.length<=7);
const lenKey=len=>len==="long"?"|long":"";
function shuffled(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dailyList(date,len="normal"){
  return shuffled(poolOf(len),mulberry32(hashStr("gojuon|"+date+lenKey(len)))).slice(0,CFG.DAILY);
}
function startDaily(){
  const d=today();const list=dailyList(d,UI.len);
  G={mode:"daily",date:d,len:UI.len,list,idx:0,results:[]};
  G.P=newPuzzle(G.list[0]);UI.screen="play";resetUI();render();
}
function startFree(){
  const seen=store.get("gojuon-seen",[]);
  const all=poolOf(UI.len);let pool=all.filter(p=>!seen.includes(p.w));if(pool.length<1){pool=all.slice();store.set("gojuon-seen",seen.filter(w=>!all.some(p=>p.w===w)))}
  const pz=pool[Math.floor(Math.random()*pool.length)];
  G={mode:"free",list:[pz],idx:0,results:G&&G.mode==="free"?G.results:[]};
  G.P=newPuzzle(pz);UI.screen="play";resetUI();render();
}
function resetUI(){UI.tool="open";UI.msg="";UI.msgKind="";UI.ans="";UI.pop=-1;UI.bad=false;UI.sent=false}
function nextPuzzle(){
  if(G.mode==="free"){startFree();return}
  G.idx++;
  if(G.idx>=G.list.length){finishDaily();return}
  G.P=newPuzzle(G.list[G.idx]);resetUI();render();window.scrollTo({top:0});
}
function recordResult(){
  const P=G.P;G.results.push({w:P.pz.w,pts:P.pts,won:P.won,opens:P.opens,booms:P.boom.size,hint:P.hint});
  if(G.mode==="free"){const seen=store.get("gojuon-seen",[]);if(!seen.includes(P.pz.w)){seen.push(P.pz.w);store.set("gojuon-seen",seen)}
    const f=store.get("gojuon-free",{n:0,pts:0,won:0});f.n++;f.pts+=P.pts;if(P.won)f.won++;store.set("gojuon-free",f)}
}
function finishDaily(){
  const total=G.results.reduce((s,r)=>s+r.pts,0);
  const rec=store.get("gojuon-daily",{});
  const key=G.date+lenKey(G.len);
  if(!rec[key])rec[key]={total,marks:G.results.map(r=>mark(r.pts)).join("")};
  store.set("gojuon-daily",rec);
  UI.screen="final";render();window.scrollTo({top:0});
}
const mark=p=>p>=80?"◎":p>=50?"○":p>0?"△":"×";

/* ================= 操作 ================= */
function onCell(i){
  const P=G.P;if(P.done)return;
  if(UI.tool==="flag"){if(toggleFlag(P,i)){sfx(P.flag.has(i)?"flag":"unflag");UI.pop=-1;render()}return}
  const r=openCell(P,i);if(!r)return;
  UI.pop=i;UI.wave=r==="safe"?P.wave:null;
  if(r==="boom"){sfx("boom");setMsg(P.done?"爆弾が3つ破裂した。この問題はここまで。":"爆発！「"+CELLS[i].kana+"」は答えの文字"+(P.mc[i]>1?"（爆弾"+P.mc[i]+"個）":"")+"。残り "+P.lives+" 回。","bad");if(P.done){recordResult();sfx("wrong")}}
  else{sfx(P.wave.size>1?"wave":"open");setMsg(P.wave.size>1?"0だったので、まわりの "+(P.wave.size-1)+" マスも開いた（点は1回分）。":"","")}
  render();UI.wave=null;
}
function onFlag(i){if(isCpuTurn())return;const P=G.mode==="vs"?G.V.P:G.P;if(toggleFlag(P,i)){sfx(P.flag.has(i)?"flag":"unflag");UI.pop=-1;render()}}
function setMsg(t,k){UI.msg=t;UI.msgKind=k}
function onAnswer(){
  const P=G.P;const el=document.getElementById("ans");const text=el?el.value:UI.ans;UI.ans=text;
  if(!fold(text)){setMsg("答えを書いてください（ひらがな・カタカナ）。","bad");render();return}
  const r=answer(P,text);
  if(r==="right"){sfx("right");recordResult();setMsg("","");UI.pop=-1;render();return}
  if(r==="wrong"){sfx("wrong");UI.bad=true;
    const n=fold(text).length,k=P.pz.f.length;
    setMsg("ちがいます（−10点）。"+(n!==k?"答えは "+k+" 文字です。":"")+(P.prefixNew?"答えの最初の文字を出しました。":""),"bad");render();UI.bad=false}
}
function onChip(k){UI.ans=(document.getElementById("ans")||{}).value||UI.ans;UI.ans+=k;sfx("pick");render();const el=document.getElementById("ans");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function onHint(){if(useHint(G.P)){sfx("hint");render()}}
function onGiveUp(){if(G.P.done)return;giveUp(G.P);recordResult();sfx("wrong");setMsg("","");render()}

/* ================= 画面 ================= */
const app=document.getElementById("app");
function render(){
  if(UI.screen==="title"){app.innerHTML=titleHTML();UI.notice=""}
  else if(UI.screen==="play")app.innerHTML=playHTML();
  else if(UI.screen==="vs")app.innerHTML=G.V.over?vsFinalHTML():vsHTML();
  else if(UI.screen==="net")app.innerHTML=netHTML();
  else app.innerHTML=finalHTML();
  bind();
  scheduleCpu();
}

/* ---- ふたりで対戦の画面 ---- */
function startVs(kind,lvl){G={mode:"vs",V:vsNew(kind,lvl,Math.floor(Math.random()*1e9),UI.len)};UI.screen="vs";resetUI();render();window.scrollTo({top:0})}
const isCpuTurn=()=>!!(G&&G.mode==="vs"&&G.V.kind==="cpu"&&!G.V.over&&!G.V.P.done&&G.V.P.turn===1);
function scheduleCpu(){clearTimeout(UI.cpuT);if(UI.screen==="vs"&&isCpuTurn()&&!UI.manualCpu)UI.cpuT=setTimeout(cpuTurn,900)}
function cpuTurn(){
  if(!isCpuTurn())return;const V=G.V,P=V.P;
  const r=cpuAct(V,Math.random);afterVs(r);
}
// 番を待つとき（コンピュータの番・オンラインで相手の番）は、開ける・答える・パスを押せない
const isRemoteTurn=()=>!!(G&&G.net&&G.V&&!G.V.over&&!G.V.P.done&&G.V.P.turn!==G.net.seat);
const isWaitTurn=()=>isCpuTurn()||isRemoteTurn();
function afterVs(r,mine=true){
  const V=G.V,P=V.P;UI.wave=null;UI.pop=-1;
  if(r==="boom"){sfx("boom");UI.pop=P.last;setMsg("爆発！ −1","bad")}
  else if(r==="safe"){UI.pop=P.last;UI.wave=P.wave;sfx(P.wave&&P.wave.size>1?"wave":"open");setMsg("","")}
  else if(r==="right"){sfx("right");setMsg("","")}
  else if(r==="wrong"){sfx("wrong");setMsg("ちがう答え −1"+(P.prefixNew?"。答えの最初の文字を出した":""),"bad")}
  else if(r==="hint"){sfx("hint");setMsg("二人ともパスしたので、問題文を出した","")}
  else if(r==="draw"){sfx("wrong");setMsg("","")}
  else if(r==="pass"){sfx("pick");setMsg("","")}
  if(r&&r!=="right"&&r!=="draw"&&V.kind==="hot")UI.ans="";
  if(r==="right"&&mine)UI.ans="";
  if(G.net&&G.net.role==="host")netSync(r);
  render();UI.wave=null;
}
function onVsCell(i){
  const V=G.V,P=V.P;if(P.done||isCpuTurn())return;
  if(UI.tool==="flag"){if(toggleFlag(P,i)){sfx(P.flag.has(i)?"flag":"unflag");UI.pop=-1;render()}return}
  if(isRemoteTurn())return;
  if(G.net&&G.net.role==="guest"){if(P.open.has(i)||P.boom.has(i)||P.flag.has(i))return;netSend({t:"act",a:"open",i,flags:[...P.flag]});UI.sent=true;render();return}
  const r=vsOpen(V,i);if(r)afterVs(r);

/* ================= 離れた友だちと（招待コードで直接つなぐ。アカウント不要） =================
   部屋を作った人（あか）の端末が対戦を進める。友だち（あお）の端末には、答えと爆弾の場所を送らない。
   印はそれぞれの端末にだけある。claude.ai の画面の中では直接つなぐ通信が止められているので、公開ページで使う */
const RTC_CFG={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun.cloudflare.com:3478"]}]};
const b64=buf=>{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=buf=>b64(buf).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return unb64(s)};
async function packDesc(desc){
  const json=JSON.stringify({t:desc.type==="offer"?"o":"a",s:desc.sdp});
  if(typeof CompressionStream==="function"){try{const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer();return "GJO1-"+b64u(buf)}catch(e){}}
  return "GJO0-"+b64u(new TextEncoder().encode(json));
}
async function unpackDesc(text){
  const m=/GJO([01])-([A-Za-z0-9_-]+)/.exec(String(text||"").replace(/\s+/g,""));
  if(!m)throw new Error("コードが読み取れません。「GJO」で始まる文字を、最後まで丸ごと貼ってください。");
  let json;
  try{const bytes=unb64u(m[2]);if(m[1]==="1"){if(typeof DecompressionStream!=="function")throw 0;json=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).text()}else json=new TextDecoder().decode(bytes)}
  catch(e){throw new Error("コードが途中で切れているようです。もう一度、最後まで丸ごとコピーしてください。")}
  let o;try{o=JSON.parse(json)}catch(e){throw new Error("コードが壊れているようです。もう一度コピーしてください。")}
  if(!o||typeof o.s!=="string"||(o.t!=="o"&&o.t!=="a"))throw new Error("このゲームのコードではありません。");
  return {type:o.t==="o"?"offer":"answer",sdp:o.s};
}
function waitIce(pc,ms){return new Promise(res=>{if(pc.iceGatheringState==="complete")return res();const t=setTimeout(res,ms||4000);pc.addEventListener("icegatheringstatechange",()=>{if(pc.iceGatheringState==="complete"){clearTimeout(t);res()}})})}

  const end=()=>{if(c.closed)return;c.closed=true;c.open=false;if(c.on.close)c.on.close()};
  dc.onopen=()=>{c.open=true;if(c.on.open)c.on.open()};
  dc.onmessage=e=>{if(typeof e.data!=="string"||e.data.length>200000)return;let m;try{m=JSON.parse(e.data)}catch(_){return}if(c.on.msg)c.on.msg(m);else if(c.q.length<50)c.q.push(m)};
  dc.onclose=end;
  pc.addEventListener("connectionstatechange",()=>{if(pc.connectionState==="failed"||pc.connectionState==="closed")end()});
  return c;
}
// NET: 部屋の準備（role "host"|"guest"）。つながったあとは G.net に移す
let NET=null;
function netTeardown(){
  const c=(G&&G.net&&G.net.conn)||(NET&&NET.conn);
  if(NET&&NET.pc&&!(NET.conn&&NET.conn.open)){try{NET.pc.close()}catch(e){}}
  NET=null;if(G&&G.net){G.net.closing=true;G.net=null}
  if(c){c.on.close=null;c.close()}
}
async function netHost(){
  netTeardown();NET={role:"host",making:true,code:"",draft:"",err:"",connected:false};UI.screen="net";render();
  try{
    const pc=new RTCPeerConnection(RTC_CFG);const conn=linkDC(pc,pc.createDataChannel("gjo",{ordered:true}));
    await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);
    if(!NET||NET.role!=="host")return;
    Object.assign(NET,{pc,conn,code:await packDesc(pc.localDescription),making:false});
    conn.on.open=()=>{if(NET&&NET.conn===conn){NET.connected=true;sfx("pick");render()}};
    conn.on.msg=m=>hostOnMsg(m);conn.on.close=()=>netLost();
  }catch(e){if(NET){NET.making=false;NET.err="招待コードを作れませんでした。この画面では、直接つなぐ通信が使えないようです。"}}
  render();
}
async function netAcceptReply(){
  if(!NET||NET.role!=="host")return;NET.err="";
  try{const d=await unpackDesc(NET.draft);
    if(d.type!=="answer")throw new Error("これは招待コードです。友だちから届いた「返事コード」を貼ってください。");
    if(NET.pc.signalingState!=="have-local-offer")throw new Error("この招待はもう使われています。いったん題にもどって、部屋を作り直してください。");
    await NET.pc.setRemoteDescription(d);NET.waiting=true;
  }catch(e){NET.err=e&&e.message||String(e)}
  render();
}
function netJoin(){netTeardown();NET={role:"guest",draft:"",reply:"",err:"",busy:false,connected:false};UI.screen="net";render()}
async function netMakeReply(){
  const g=NET;if(!g||g.role!=="guest"||g.busy)return;g.err="";g.busy=true;render();
  try{
    const d=await unpackDesc(g.draft);
    if(d.type!=="offer")throw new Error("これは返事コードです。部屋の人から届いた「招待コード」を貼ってください。");
    const pc=new RTCPeerConnection(RTC_CFG);g.pc=pc;
    const opened=new Promise(res=>{pc.ondatachannel=e=>{const conn=linkDC(pc,e.channel);if(e.channel.readyState==="open"){conn.open=true;res(conn)}else conn.on.open=()=>res(conn)}});
    await pc.setRemoteDescription(d);await pc.setLocalDescription(await pc.createAnswer());await waitIce(pc);
    g.reply=await packDesc(pc.localDescription);g.busy=false;render();
    pc.addEventListener("connectionstatechange",()=>{if(pc.connectionState==="failed"&&NET===g&&!g.connected){g.err="つながりませんでした。ちがうネットワーク同士だと、つながらないことがあります。";render()}});
    const conn=await opened;if(NET!==g){conn.close();return}
    g.conn=conn;g.connected=true;conn.on.msg=guestOnMsg;conn.q.splice(0).forEach(guestOnMsg);conn.on.close=()=>netLost();
    sfx("pick");render();
  }catch(e){g.busy=false;g.err=e&&e.message||String(e);render()}
}
function netSend(m){const c=(G&&G.net&&G.net.conn)||(NET&&NET.conn);if(c)c.send(m)}
function netLost(){
  if(G&&G.net&&G.net.closing)return;
  NET=null;if(G&&G.net)G.net=null;
  clearTimeout(UI.cpuT);UI.screen="title";UI.notice="あいてとのつながりが切れました。";render();
}
// 部屋の人: 対戦を始める／もう一度
function netStart(){
  const conn=(G&&G.net&&G.net.conn)||(NET&&NET.conn);if(!conn||!conn.open)return;
  const V=vsNew("online",0,Math.floor(Math.random()*1e9),UI.len);
  G={mode:"vs",V,net:{role:"host",seat:0,conn}};NET=null;
  UI.screen="vs";resetUI();netSync("start");render();window.scrollTo({top:0});
}
// 友だちに送る盤（答え・爆弾の場所・相手の印は入れない。終わった問題だけ答えを入れる）
function pubState(V,ev){
  const P=V.P,chars=[...P.pz.w].filter(c=>!/\s|・/.test(c));
  return {t:"state",ev,round:V.round,rounds:V.rounds,score:V.score,names:V.names,len:V.len,over:V.over,
    results:V.results.map(r=>({w:r.w,winner:r.winner,pl:r.pl})),
    P:{cat:P.pz.cat,n:P.pz.f.length,q:P.hint||P.done?P.pz.q:null,open:[...P.open].map(i=>[i,P.cnt[i]]),boom:[...P.boom].map(i=>[i,P.mc[i]]),
      turn:P.turn,passes:P.passes,hint:P.hint,done:P.done,winner:P.winner,w:P.done?P.pz.w:null,
      reveal:P.done?[...P.mines].map(i=>[i,P.mc[i]]):[],log:P.log.slice(0,12),pl:P.pl,prefix:P.prefix||0,
      prefixChars:chars.slice(0,P.prefix||0),prefixTotal:chars.length,prefixNew:!!P.prefixNew,last:P.last,
      wave:ev&&ev.kind==="safe"&&P.wave?[...P.wave]:null}};
}
function netSync(kind){if(!G||!G.net||G.net.role!=="host")return;const P=G.V.P;netSend(pubState(G.V,{kind,by:P.turn}))}
function hostOnMsg(m){
  if(!m||!G||!G.net||G.net.role!=="host")return;
  const V=G.V,P=V.P;
  if(m.t==="next"){if(P.done&&!V.over)onVsNext();else netSync("sync");return}
  if(m.t!=="act"||V.over||P.done||P.turn!==1){netSync("sync");return}
  const flags=new Map(Array.isArray(m.flags)?m.flags.filter(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[0]>=0&&x[0]<CELLS.length).map(x=>[x[0],x[1]|0]):[]);
  let r=null;
  if(m.a==="open"&&Number.isInteger(m.i)&&m.i>=0&&m.i<CELLS.length)r=vsOpen(V,m.i,flags);
  else if(m.a==="answer"&&typeof m.text==="string"&&m.text.length<=40)r=vsAnswer(V,m.text,flags);
  else if(m.a==="pass")r=vsPass(V);
  if(!r){netSync("sync");return}
  afterVs(r,false);
}
// 友だち: 届いた盤から画面用の状態を組み立てる
function guestOnMsg(m){
  if(!m||m.t!=="state")return;
  const prev=G&&G.net&&G.V?G.V:null;const conn=(G&&G.net&&G.net.conn)||(NET&&NET.conn);
  const sameRound=prev&&prev.round===m.round&&!prev.over;
  const flags=sameRound?prev.P.flag:new Map();
  const p=m.P,mc=new Int8Array(CELLS.length),cnt=new Array(CELLS.length).fill(0);
  for(const [i,c] of p.open)cnt[i]=c;for(const [i,c] of p.boom)mc[i]=c;for(const [i,c] of p.reveal)mc[i]=c;
  const P={pz:{cat:p.cat,q:p.q||"",w:p.w||"",f:{length:p.n}},open:new Set(p.open.map(x=>x[0])),cnt,boom:new Set(p.boom.map(x=>x[0])),mc,
    mines:new Set(p.reveal.map(x=>x[0])),flag:flags,turn:p.turn,passes:p.passes,hint:p.hint,done:p.done,winner:p.winner,log:p.log,pl:p.pl,
    prefix:p.prefix,prefixChars:p.prefixChars,prefixTotal:p.prefixTotal,prefixNew:p.prefixNew,last:p.last,wave:p.wave?new Map(p.wave):null};
  for(const i of [...flags.keys()])if(P.open.has(i)||P.boom.has(i))flags.delete(i);
  const V={kind:"online",names:m.names,score:m.score,round:m.round,rounds:m.rounds,over:m.over,results:m.results,len:m.len,P};
  const fresh=!G||!G.net;
  G={mode:"vs",V,net:{role:"guest",seat:1,conn}};NET=null;
  if(fresh||!sameRound||m.ev.kind==="start"){resetUI();window.scrollTo({top:0})}
  UI.sent=false;UI.screen="vs";
  const k=m.ev&&m.ev.kind;
  if(k&&k!=="sync"&&k!=="start"&&k!=="next"){const mine=m.ev.by===1;afterVs(k,mine);return}
  render();
}
function netHTML(){
  const n=NET||{};const note='<p class="note">claude.ai の画面の中では、つながりません。公開ページ <a href="https://erushio2-sudo.github.io/gojuon/" target="_blank" rel="noopener">erushio2-sudo.github.io/gojuon</a> を開いて遊んでください。ちがうネットワーク同士では、つながらないことがあります。</p>';
  const copyBtn=id=>`<button class="btn small" data-copy="${id}">コピー</button>`;
  let h=`<div class="top"><button class="btn small" id="bHome">題へ</button><span class="qno">${n.role==="host"?"部屋を作る":"部屋に入る"}</span></div><div class="netbox">`;
  if(n.role==="host"){
    h+=`<div class="step"><b>1</b><div><div>この「招待コード」を、友だちに送る（LINEやメールなどで）</div>
      ${n.making?'<p class="note">招待コードを作っています…</p>':`<textarea id="netCode" readonly rows="3">${esc(n.code)}</textarea><div class="row">${copyBtn("netCode")}</div>`}</div></div>
      <div class="step"><b>2</b><div><div>友だちから届いた「返事コード」を貼って、つなぐ</div>
      <textarea id="netDraft" rows="3" placeholder="GJO で始まる返事コード" ${n.connected?"disabled":""}>${esc(n.draft||"")}</textarea>
      <div class="row"><button class="btn main" id="bNetAccept" ${n.connected||n.making?"disabled":""}>つなぐ</button></div></div></div>`;
    if(n.connected)h+=`<div class="ok">つながりました！ 問題の長さ: ${UI.len==="long"?"ながい（8文字以上）":"ふつう（5〜7文字）"}<div class="row"><button class="btn main" id="bNetStart">対戦を始める</button></div><p class="note">あなたは「あか」で、第1問の先手です。</p></div>`;
    else if(n.waiting)h+=`<p class="note">つないでいます…（30秒ほどかかることがあります）</p>`;
  }else{
    h+=`<div class="step"><b>1</b><div><div>部屋の人から届いた「招待コード」を貼る</div>
      <textarea id="netDraft" rows="3" placeholder="GJO で始まる招待コード" ${n.reply?"disabled":""}>${esc(n.draft||"")}</textarea>
      <div class="row"><button class="btn main" id="bNetReply" ${n.busy||n.reply?"disabled":""}>${n.busy?"作っています…":"返事コードを作る"}</button></div></div></div>`;
    if(n.reply)h+=`<div class="step"><b>2</b><div><div>この「返事コード」を、部屋の人に送り返す</div><textarea id="netCode" readonly rows="3">${esc(n.reply)}</textarea><div class="row">${copyBtn("netCode")}</div></div></div>`;
    if(n.connected)h+=`<div class="ok">つながりました！ 部屋の人が対戦を始めるのを待っています。<p class="note">あなたは「あお」です。</p></div>`;
    else if(n.reply)h+=`<p class="note">部屋の人がつなぐのを待っています…</p>`;
  }
  if(n.err)h+=`<p class="msg bad">${esc(n.err)}</p>`;
  return h+note+"</div>";
}
window.DEV={
  get G(){return G},get UI(){return UI},vsNew,vsOpen,vsAnswer,vsPass,vsNext,cpuDecide,cpuAct,VS,
  manualCpu(on=true){UI.manualCpu=on;clearTimeout(UI.cpuT)},cpuNow(){cpuTurn()},
  // コンピュータ同士の対戦: a/b は強さ（0〜2）。先手の有利と、強さの差を測る
  vsSims(n=40,a=1,b=1,len="normal"){const out={n,win:[0,0],draw:0,pts:[0,0],turns:0,flowed:0,rightFirst:0,booms:0,wrongs:0};
    for(let g=0;g<n;g++){const V=vsNew("cpu",a,hashStr("sim|"+g+"|"+a+"|"+b),len);const rnd=mulberry32(g*7919+3);
      while(!V.over){const P=V.P;let guard=0;while(!P.done&&guard++<200){V.lvl=P.turn===0?a:b;const r=cpuAct(V,rnd);out.turns++;if(r==="boom")out.booms++;if(r==="wrong")out.wrongs++}
        if(P.winner<0)out.flowed++;else if(P.winner===V.round%2)out.rightFirst++;vsNext(V)}
      out.pts[0]+=V.score[0];out.pts[1]+=V.score[1];if(V.score[0]>V.score[1])out.win[0]++;else if(V.score[0]<V.score[1])out.win[1]++;else out.draw++}
    out.turns=+(out.turns/(n*VS.ROUNDS)).toFixed(1);out.pts=out.pts.map(x=>+(x/n).toFixed(2));out.firstWinRate=+(out.rightFirst/(n*VS.ROUNDS)).toFixed(2);return out},CELLS,NB,PUZ,CFG,fold,newPuzzle,openCell,toggleFlag,answer,analyze,determined,botPlay,dailyList,scoreOf,
  mute(){SND.hardMute=true},
  // 問題の検査: 表にない字・同じ字のくり返し・字数
  audit(){const bad=[];const seen=new Set();for(const p of PUZ){const ks=[...p.f];
      if(seen.has(p.w))bad.push(p.w+": 重複");seen.add(p.w);
      if(ks.length<5)bad.push(p.w+": 字数 "+ks.length);
      {const m={};for(const k of ks)m[k]=(m[k]||0)+1;if(Math.max(...Object.values(m))>CAP)bad.push(p.w+": 同じ字が多すぎる")}
      for(const k of ks)if(BYKANA[k]===undefined)bad.push(p.w+": 表にない字 "+k)}
    return {n:PUZ.length,bad}},
  // bot で全問を何回か解く
  sims(n=4,how="smart"){const out=[];for(const p of PUZ){let s=0,o=0,b=0,w=0;for(let k=0;k<n;k++){const r=botPlay(p,hashStr(p.w+"|"+k),how);s+=r.pts;o+=r.opens;b+=r.booms;w+=r.won?1:0}
      out.push({w:p.w,pts:s/n,opens:o/n,booms:b/n,won:w/n})}return out},
  state(){const P=G&&G.P;return P?{w:P.pz.w,opens:P.opens,booms:P.boom.size,lives:P.lives,done:P.done,won:P.won,pts:P.pts,flags:foundKana(P)}:null},
  cellOf(k){return BYKANA[k]}
};
